<!DOCTYPE html>
<html>
<head>
    <title>Debug Auth</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .warning { background: #fff3cd; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔧 Debug de Autenticación</h1>
    
    <div class="section">
        <h2>1. Estado Local</h2>
        <div id="localState"></div>
    </div>
    
    <div class="section">
        <h2>2. Verificación con Servidor</h2>
        <button onclick="verifyWithServer()">Verificar Token</button>
        <div id="serverState"></div>
    </div>
    
    <div class="section">
        <h2>3. Acciones</h2>
        <button onclick="goToApp()">Ir a App</button>
        <button onclick="clearAuth()">Limpiar Auth</button>
        <button onclick="location.reload()">Recargar</button>
    </div>

    <script src="js/auth.js"></script>
    <script>
        function displayLocalState() {
            const state = {
                'driveUser': localStorage.getItem('driveUser'),
                'driveToken': localStorage.getItem('driveToken'),
                'auth.isAuthenticated()': auth.isAuthenticated(),
                'auth.currentUser': auth.getCurrentUser(),
                'auth.token (length)': auth.token ? auth.token.length : 'null'
            };
            
            let html = '<ul>';
            for (const [key, value] of Object.entries(state)) {
                html += `<li><strong>${key}:</strong> ${typeof value === 'object' ? JSON.stringify(value) : value}</li>`;
            }
            html += '</ul>';
            
            document.getElementById('localState').innerHTML = html;
        }
        
        async function verifyWithServer() {
            const serverState = document.getElementById('serverState');
            serverState.innerHTML = '<p>Verificando...</p>';
            
            try {
                const response = await fetch('/auth/verify', {
                    headers: auth.getAuthHeaders()
                });
                
                const result = await response.json();
                
                let html = `<div class="${result.success ? 'success' : 'error'}">`;
                html += `<h3>${result.success ? '✅ ÉXITO' : '❌ ERROR'}</h3>`;
                html += `<pre>${JSON.stringify(result, null, 2)}</pre>`;
                html += `</div>`;
                
                serverState.innerHTML = html;
            } catch (error) {
                serverState.innerHTML = `<div class="error"><p>Error: ${error.message}</p></div>`;
            }
        }
        
        function goToApp() {
            window.location.href = '/';
        }
        
        function clearAuth() {
            auth.clearAuth();
            displayLocalState();
        }
        
        // Mostrar estado al cargar
        displayLocalState();
    </script>
</body>
</html>
