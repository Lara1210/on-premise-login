<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DriveOnPremise</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <div class="logo-icon">📁</div>
                    <h1>DriveOnPremise</h1>
                </div>
                <p class="auth-subtitle">Inicia sesión en tu cuenta</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-auth" id="loginBtn">
                    <span id="loginBtnText">Iniciar Sesión</span>
                    <div class="spinner hidden" id="loginSpinner"></div>
                </button>

                <div class="auth-links">
                    <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate aquí</a></p>
                </div>
            </form>

            <form id="registerForm" class="auth-form hidden">
                <div class="form-group">
                    <label for="regUsername">Usuario</label>
                    <input type="text" id="regUsername" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="regEmail">Email (opcional)</label>
                    <input type="email" id="regEmail" name="email" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" name="password" required autocomplete="new-password">
                    <small>Mínimo 6 caracteres</small>
                </div>

                <div class="form-group">
                    <label for="regConfirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="regConfirmPassword" name="confirmPassword" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-auth" id="registerBtn">
                    <span id="registerBtnText">Crear Cuenta</span>
                    <div class="spinner hidden" id="registerSpinner"></div>
                </button>

                <div class="auth-links">
                    <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión aquí</a></p>
                </div>
            </form>

            <div class="auth-footer">
                <p class="demo-accounts">
                    <strong>Cuenta de demostración:</strong><br>
                    Usuario: <code>admin</code> | Contraseña: <code>admin123</code>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/auth-ui.js"></script>
</body>
</html>
